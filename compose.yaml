name: tp-evals-workshop

services:
  lab:
    build:
      context: .
    working_dir: /workspace
    volumes:
      - .:/workspace
      - lab-node-modules:/workspace/node_modules
    environment:
      WORKSHOP_MODE: ${WORKSHOP_MODE:-live}
      EVALITE_DB_PATH: ${EVALITE_DB_PATH:-/workspace/.evalite/evalite.db}
      EVALITE_RESULT_PATH: ${EVALITE_RESULT_PATH:-/workspace/.evalite/results/latest.json}
      EVALITE_PORT: ${EVALITE_PORT:-3006}
      EVALITE_SCORE_THRESHOLD: ${EVALITE_SCORE_THRESHOLD:-60}
      EVALITE_MAX_CONCURRENCY: ${EVALITE_MAX_CONCURRENCY:-1}
      EVALITE_TEST_TIMEOUT_MS: ${EVALITE_TEST_TIMEOUT_MS:-90000}
      EVALITE_CACHE: ${EVALITE_CACHE:-true}
      EVALITE_HIDE_TABLE: ${EVALITE_HIDE_TABLE:-false}
      LIVE_LLM_ENABLED: ${LIVE_LLM_ENABLED:-true}
      AI_PROXY_BASE_URL: ${AI_PROXY_BASE_URL:-https://ai-proxy-zane.web-revolution.cz}
      AI_PROXY_MODEL: ${AI_PROXY_MODEL:-gpt-5.2-codex}
      AI_PROXY_JUDGE_MODEL: ${AI_PROXY_JUDGE_MODEL:-gpt-5.2-codex}
      AI_PROXY_FALLBACK_MODELS: ${AI_PROXY_FALLBACK_MODELS:-gpt-5.4-mini,gemini-3-flash-preview,claude-haiku-4.5,gpt-5.3-codex}
      AI_PROXY_TIMEOUT_MS: ${AI_PROXY_TIMEOUT_MS:-60000}
      AI_PROXY_API_KEY: ${AI_PROXY_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      OPENROUTER_JUDGE_MODEL: ${OPENROUTER_JUDGE_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-poolside/laguna-m.1:free,openai/gpt-oss-120b:free,openrouter/owl-alpha}
      OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-60000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    entrypoint: ["bash", "./scripts/docker-entrypoint.sh"]
    command: ["pnpm", "run", "smoke"]

volumes:
  lab-node-modules:
